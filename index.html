<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Flow sync</title>
<style>
  :root { color-scheme: light dark; --bg:#faf9f7; --fg:#1a1a1a; --dim:#6b6b6b; --line:#e3e2df; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191919; --fg:#e9e9e7; --dim:#9b9a97; --line:#2f2f2f; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); padding:1.5rem;
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  main { max-width:30rem; text-align:center; }
  h1 { font-size:1.3rem; font-weight:600; margin:0 0 .4rem; }
  .sub { color:var(--dim); font-size:.95rem; margin:0 0 1.5rem; }
  .note {
    border:1px solid var(--line); border-radius:10px; padding:1rem 1.15rem;
    text-align:left; font-size:.9rem; color:var(--dim); margin-bottom:1.25rem;
  }
  .note strong { color:var(--fg); font-weight:600; }
  a.again {
    display:inline-block; padding:.6rem 1.15rem; border:1px solid var(--line);
    border-radius:8px; text-decoration:none; color:var(--fg); font-size:.9rem;
  }
  a.again:hover { border-color:var(--dim); }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.88em; }
</style>
</head>
<body>
<main>
  <h1>Sync triggered</h1>
  <p class="sub">Close this tab whenever. The sync runs on your machine.</p>

  <div class="note">
    <strong>First time?</strong> Chrome asks permission to open Flow Sync.
    Tick <strong>Always allow</strong>, then confirm — otherwise nothing runs.
    If you dismissed it, hit the button below.
  </div>

  <a class="again" href="flow://run">Run it again</a>
</main>
<script>
  // Hand off to the local flow:// handler. This page does nothing on its own -
  // without that handler registered on the machine, every link here is inert.
  //
  // Do NOT call window.close() here. Notion opens links via window.open(), which
  // makes this tab script-closeable, so a close() actually succeeds - and it
  // tears down Chrome's protocol permission dialog before the handoff completes,
  // silently preventing the sync from ever running.
  location.href = "flow://run";
</script>
</body>
</html>
